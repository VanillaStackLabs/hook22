services:
  # SFTP Webhook Gateway
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sftp-gateway
    ports:
      - "2222:2222" # SFTP Protocol
      - "8080:8080" # Real-Time SSE Log & Metrics API
    volumes:
      - ./config.yaml:/config.yaml
      - ./keys:/keys
      - ./data:/data
    depends_on:
      create-bucket:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # Persistent Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-broker
    ports:
      - "5672:5672"   # AMQP Protocol
      - "15672:15672" # Web Management Dashboard
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local S3 Emulator (Chainguard MinIO)
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio-s3
    ports:
      - "9000:9000" # S3 API Endpoint
      - "9001:9001" # Web Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9001"]

  # Automated S3 Bucket Initializer (Authenticated AWS CLI)
  create-bucket:
    image: amazon/aws-cli:latest
    container_name: minio-bucket-init
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://minio:9000 s3 mb s3://my-sftp-drops || true;
      echo 'Bucket s3://my-sftp-drops created cleanly!';
      "

  # Local Webhook Receiver
  webhook-echo:
    image: ealen/echo-server:latest
    container_name: webhook-receiver
    ports:
      - "3000:80"