version: "3.8"

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: sftp-webhook-gateway:latest
    container_name: sftp-webhook-gateway
    restart: unless-stopped
    ports:
      - "2222:2222" # SFTP Protocol
      - "8080:8080" # SSE Log Stream & Prometheus Metrics API
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./keys:/keys:ro
      
      # Uncomment if using Google Cloud Storage (GCS) driver:
      # - ./gcp-creds.json:/gcp-creds.json:ro
      
      # Uncomment if using Local Disk driver (ensure base_path: "/data" is set in config.yaml):
      # - ./data:/data
      
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "2222"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s