services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: sftp-webhook-gateway:latest
    container_name: sftp-webhook-gateway
    restart: unless-stopped
    ports:
      - "2222:2222" # SFTP Protocol
      - "8080:8080" # SSE Log Stream & Prometheus Metrics API
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./keys:/keys:ro
      # Uncomment if using Google Cloud Storage (GCS) driver:
      # - ./gcp-creds.json:/gcp-creds.json:ro
      # Uncomment if using Local Disk driver:
      # - ./data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "2222"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-broker
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP Protocol
      - "15672:15672" # Web Management Dashboard
    environment:
      # IMPORTANT: Change these in production!
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data: